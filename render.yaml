# Render Blueprint – im Dashboard "New +" -> "Blueprint" -> dieses Repo waehlen.
# Danach BOT_TOKEN und CHAT_IDS unter Environment eintragen.
services:
  - type: web
    name: mediamarkt-klima-notifier
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false                # geheim, selbst eintragen
      - key: CHAT_IDS
        sync: false                # Telegram: eine/mehrere IDs, kommagetrennt: 123,456
      - key: DISCORD_WEBHOOK_URL
        sync: false                # Discord-Webhook (Variante 1, optional)
      - key: DISCORD_BOT_TOKEN
        sync: false                # Discord-Bot-Token (Variante 2, REST)
      - key: DISCORD_CHANNEL_ID
        sync: false                # (Alt) Kanal-ID; dient als Default-Speicherort
      - key: DISCORD_STORE_CHANNEL_ID
        value: "540112008310161410"  # ruhiger Kanal (#bot-log) fuer die persistente Abo-Liste
      - key: DISCORD_GUILD_ID
        value: "464447525454217216"  # Server (fuer Rollen-Vergabe)
      - key: DISCORD_ROLE_ID
        value: "1521468616590102578" # Rolle "🌬️ Klima-Abo" -> /notify-me-here
      - key: DISCORD_NOTIFY_CHANNEL_ID
        value: "464901478977503232"  # #bot-spam -> hier wird @Klima-Abo gepingt
      - key: TURSO_URL
        value: "libsql://schnorkle-ivofehn.aws-eu-west-1.turso.io"  # dauerhafte Stats (cloud-SQLite)
      - key: TURSO_TOKEN
        sync: false                 # geheimer Turso-Auth-Token (selbst eintragen)
      - key: DISCORD_MENTION
        value: ""                  # leer | "everyone" | "here"  -> optionaler Ping
      - key: DISCORD_PUBLIC_KEY
        value: decb18aa4317a68aa9eed041acbf7b559dbe297038f8bdff83e779a20c7820dc  # Public Key (nicht geheim) fuer Slash-Command-Signatur
      - key: PRODUCT_URL
        value: https://www.mediamarkt.de/de/product/_ok-oac-7022-w-klimagerat-weiss-max-raumgrosse-67-m-2763143.html
      - key: SKU
        value: "2763143"
      - key: IDLE_SEC
        value: "4"                 # Poll-Takt wenn NICHT verfuegbar (~3-5s)
      - key: ACTIVE_SEC
        value: "2"                 # Poll-Takt SOLANGE verfuegbar (engmaschig)
      - key: CONFIRM_PROBES
        value: "3"                 # Schnell-Verify gegen CDN-Ausreisser
      - key: CONFIRM_GAP_MS
        value: "600"               # kurzer Abstand im Verify-Modus
      - key: GONE_CONFIRM
        value: "3"                 # so oft "weg" in Folge -> erst dann Re-Trigger (Anti-Flacker)
      - key: KEEPALIVE_MIN
        value: "10"                # Self-Wakeup-Takt (nutzt RENDER_EXTERNAL_URL automatisch)
